<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Registro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Registro</h2>

<form
id="formRegistro"
action="procesarRegistro.php"
method="POST">

<div class="mb-3">

<label>Nombre</label>

<input
type="text"
id="nombre"
name="nombre"
class="form-control">

</div>

<div class="mb-3">

<label>Correo</label>

<input
type="email"
id="correo"
name="correo"
class="form-control">

</div>

<div class="mb-3">

<label>Contraseña</label>

<input
type="password"
id="password"
name="password"
class="form-control">

</div>
<div class="mb-3">

    <label class="form-label">
        Validación humana: Selecciona el color azul
    </label>

    <select id="color" class="form-control">

        <option value="">
            Selecciona una opción
        </option>

        <option value="rojo">
            Rojo
        </option>

        <option value="azul">
            Azul
        </option>

        <option value="verde">
            Verde
        </option>

        <option value="amarillo">
            Amarillo
        </option>

    </select>

</div>
    
<button
class="btn btn-primary">

Registrarse

</button>

</form>

</div>

<script src="Js/usuaRio.js"></script>
<script src="Js/validaciOnes.js"></script>

</body>

</html>
